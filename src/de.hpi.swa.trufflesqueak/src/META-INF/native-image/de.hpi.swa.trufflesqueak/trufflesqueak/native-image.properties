# This file contains native-image arguments needed to build TruffleSqueak
#

Args = --initialize-at-build-time=de.hpi.swa.trufflesqueak \
       --initialize-at-run-time=de.hpi.swa.trufflesqueak.interpreterproxy.InterpreterProxy \
       --initialize-at-run-time=de.hpi.swa.trufflesqueak.shared.PlatformEventLoop \
       --features=de.hpi.swa.trufflesqueak.util.HostInteropFeature \
       --add-exports=java.base/jdk.internal.module=de.hpi.swa.trufflesqueak \
       -H:MaxRuntimeCompileMethods=5000 \
       --link-at-build-time \
       -Dorg.graalvm.launcher.relative.smalltalk.home\=.. \
